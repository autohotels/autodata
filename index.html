<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master Application All-in-One</title><style>*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#f1f5f9;color:#142334}header{background:#142c4b;color:white;padding:20px}main{max-width:1200px;margin:auto;padding:18px}section{background:white;border-radius:12px;padding:18px;margin:14px 0}nav{display:flex;flex-wrap:wrap;gap:6px}button{background:#1769aa;color:white;border:0;border-radius:6px;padding:10px;margin:4px;cursor:pointer}button:disabled{opacity:.5}input,select,textarea{padding:10px;border:1px solid #aabbcc;border-radius:6px;width:100%;margin:5px 0}label{display:block;margin-top:10px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}pre{overflow:auto}#message{white-space:pre-wrap}small{color:#526176}</style></head><body><header><h1>Master Application</h1><p>Hotel & Restaurant — All-in-One</p></header><main><section><h2>Koneksi</h2><label>URL GAS /exec<input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Token pribadi<input id="token" type="password" autocomplete="off"></label><button id="connect">Hubungkan</button><button id="logout">Keluar</button><p><small>URL disimpan di perangkat ini. Token hanya di memori tab, tidak disimpan permanen.</small></p><div id="message" role="status" aria-live="polite"></div></section><nav id="nav"></nav><div id="app"></div></main><script>
const SCHEMA={"housekeeping": ["room", "assignee", "notes"], "maintenance": ["location", "issue", "assignee", "notes"], "shift-handover": ["shift", "assignee", "notes"], "inventory": ["item", "quantity", "unit", "notes"], "restaurant-operations": ["table", "order", "assignee", "notes"]};
const LABELS={'housekeeping':'Housekeeping','maintenance':'Maintenance','shift-handover':'Shift Handover','inventory':'Inventory','restaurant-operations':'Restaurant Operations'};
const ACTIONS={admin:['list','create','update','delete'],supervisor:['list','create','update'],staff:['list','create','update'],viewer:['list']};
const app=document.querySelector('#app'),msgEl=document.querySelector('#message');let token='',user=null,view='dashboard',module='housekeeping',rows=[];
const urlInput=document.querySelector('#url');try{urlInput.value=localStorage.getItem('master-api-url')||'';}catch(e){}
function el(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n;}
function msg(t){msgEl.textContent=t;}
function btn(text,fn,parent){const b=el('button',text,parent);b.type='button';b.onclick=async()=>{b.disabled=true;try{await fn();}catch(e){msg(e.message);}finally{b.disabled=false;}};return b;}
function card(title){const c=el('section',undefined,app);el('h2',title,c);return c;}
function allowed(a){return !!user&&ACTIONS[user.role]?.includes(a);}
async function api(action,m,extra={}){if(!token)throw Error('Masukkan token.');const url=urlInput.value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url))throw Error('URL harus deployment resmi GAS berakhiran /exec.');const r=await fetch(url,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,module:m,token,...extra})});const text=await r.text();let result;try{result=JSON.parse(text);}catch(e){throw Error('Respons bukan JSON. Periksa URL dan akses deployment.');}if(!result.ok)throw Error(result.error||'Gagal');return result.data;}
const nav=document.querySelector('#nav');for(const [key,title] of [['dashboard','Dashboard'],['data-table','Data Table'],['form-builder','Form Builder'],['workflow','Workflow'],['permissions','Permissions'],['report-engine','Reports'],...Object.entries(LABELS)])btn(title,async()=>{view=key;await render();},nav);
function choose(c){const s=el('select',undefined,c);for(const [k,v] of Object.entries(LABELS)){if(user.modules&&!user.modules.includes(k))continue;const o=el('option',v,s);o.value=k;}s.value=module;s.onchange=()=>{module=s.value;render().catch(e=>msg(e.message));};}
function form(c,record=null){const f=el('form',undefined,c),controls={};for(const key of [...SCHEMA[module],'status']){const label=el('label',key,f);let input;if(key==='status'){input=el('select',undefined,label);for(const status of ['open','in_progress','done']){const o=el('option',status,input);o.value=status;}}else{input=el(key==='notes'?'textarea':'input',undefined,label);input.required=key!=='notes';input.maxLength=2000;if(key==='quantity'){input.type='number';input.min=0;input.step='any';}}input.value=record?.[key]??(key==='status'?'open':'');controls[key]=input;}const save=el('button',record?'Simpan perubahan':'Tambah data',f);save.type='submit';f.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{const data=Object.fromEntries(Object.entries(controls).map(([k,v])=>[k,v.value]));if(record){data.id=record.id;data.version=record.version;}await api(record?'update':'create',module,{record:data});await render();msg('Data tersimpan.');}catch(err){msg(err.message);}finally{save.disabled=false;}};if(record)btn('Batal',render,f);}
function table(c,data,editable){const wrap=el('div',undefined,c);wrap.className='scroll';const t=el('table',undefined,wrap),head=el('tr',undefined,el('thead',undefined,t));const cols=['id',...SCHEMA[module],'status','version','updatedAt'];for(const key of cols)el('th',key,head);if(editable)el('th','Aksi',head);const body=el('tbody',undefined,t);for(const record of data){const tr=el('tr',undefined,body);for(const key of cols)el('td',String(record[key]??''),tr);if(editable){const td=el('td',undefined,tr);if(allowed('update'))btn('Edit',()=>{const edit=card('Edit data');form(edit,record);edit.scrollIntoView();},td);if(allowed('delete'))btn('Hapus',async()=>{if(confirm('Hapus '+record.id+'?')){await api('delete',module,{record:{id:record.id,version:record.version}});await render();}},td);}}}
function exportCSV(data){if(!data.length){msg('Tidak ada data.');return;}const keys=Object.keys(data[0]);const quote=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replaceAll('"','""')+'"';const content='\ufeff'+[keys,...data.map(r=>keys.map(k=>r[k]))].map(r=>r.map(quote).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=module+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
async function render(){app.replaceChildren();if(!user){msg('Hubungkan terlebih dahulu.');return;}msg('Terhubung: '+user.name+' — '+user.role);if(view==='permissions'){const c=card('Permissions');el('p','Matriks tampilan saja. Otorisasi dan pengaturan cakupan modul dilakukan di GAS.',c);el('pre',JSON.stringify({roles:ACTIONS,myModules:user.modules},null,2),c);return;}if(view==='dashboard'){const c=card('Dashboard');for(const m of user.modules){const data=await api('list',m);el('p',LABELS[m]+': '+data.length+' data, '+data.filter(r=>r.status==='done').length+' selesai',c);}return;}if(SCHEMA[view])module=view;if(!user.modules.includes(module)){module=user.modules[0];}if(!module)throw Error('Tidak ada modul diizinkan.');const c=card(LABELS[module]);if(!SCHEMA[view])choose(c);if(view==='form-builder'){el('p','Renderer form berbasis skema, bukan editor drag-and-drop. Ubah SCHEMA di index.html dan MODULES di Code.gs secara konsisten.',c);el('pre',JSON.stringify(SCHEMA[module],null,2),c);if(allowed('create'))form(c);return;}if(view==='workflow')el('p','Alur: open → in_progress → done. done → open hanya admin/supervisor. Gunakan Edit untuk mengganti status.',c);rows=await api('list',module);const search=el('input',undefined,c);search.placeholder='Cari data...';let filtered=rows;const holder=el('div',undefined,c);const draw=()=>{holder.replaceChildren();table(holder,filtered,view!=='report-engine');};search.oninput=()=>{filtered=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(search.value.toLowerCase()));draw();};draw();btn('Ekspor CSV',()=>exportCSV(filtered),c);btn('Muat ulang',render,c);if(view==='report-engine')el('p',`Total ${rows.length}; open ${rows.filter(r=>r.status==='open').length}; in progress ${rows.filter(r=>r.status==='in_progress').length}; done ${rows.filter(r=>r.status==='done').length}`,c);else if(allowed('create'))form(card('Tambah data'));}
document.querySelector('#connect').onclick=async()=>{const b=document.querySelector('#connect');b.disabled=true;try{token=document.querySelector('#token').value.trim();user=await api('me');try{localStorage.setItem('master-api-url',urlInput.value.trim());}catch(e){}document.querySelector('#token').value='';await render();}catch(e){token='';user=null;app.replaceChildren();msg(e.message);}finally{b.disabled=false;}};document.querySelector('#logout').onclick=()=>{token='';user=null;rows=[];app.replaceChildren();document.querySelector('#token').value='';msg('Sudah keluar.');};msg('Masukkan URL GAS dan token, lalu klik Hubungkan.');
</script></body></html>
